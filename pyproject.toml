[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdfpad"
version = "0.5.0"
description = "Offline PDF conversion desktop app for Linux"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Rainiel Dejito" }]
requires-python = ">=3.10"
dependencies = [
    "pypdf>=6.0,<7",
    "pypdfium2>=5.0,<6",
    "Pillow>=11.0",
    "pikepdf>=9.0,<10",
    "pdfminer.six>=2025.0",
    "PySide6-Essentials>=6.7,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-qt>=4.4"]
build = ["pyinstaller>=6.0"]

[project.scripts]
pdfpad = "gui.app:main"

[tool.setuptools.packages.find]
include = ["core*", "gui*"]

[tool.setuptools.package-data]
gui = ["resources/*.png", "resources/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
